[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "dataforge"
version = "0.1.0"
description = "Document knowledge production platform"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "alembic>=1.16,<2",
  "cryptography>=45,<47",
  "minio>=7.2,<8",
  "httpx>=0.28,<1",
  "jsonschema>=4.24,<5",
  "llama-index-embeddings-openai-like>=0.3,<0.4",
  "networkx>=3.6.1",
  "openpyxl>=3.1,<4",
  "openai>=1.99,<2",
  "pypdf>=5.9,<7",
  "pyarrow>=20,<22",
  "pymilvus>=2.5,<3",
  "PyMySQL>=1.1,<2",
  "python-docx>=1.2,<2",
  "pyyaml>=6,<7",
  "SQLAlchemy>=2.0,<3",
]

[project.optional-dependencies]
web = [
  "fastapi>=0.116,<1",
  "python-multipart>=0.0.20,<1",
  "uvicorn[standard]>=0.35,<1",
]

[project.scripts]
dataforge = "dataforge.cli:main"
dataforge-web = "dataforge.v7.web:main"
dataforge-worker = "dataforge.v7.worker:main"
dataforge-runner = "dataforge.v7.runner:main"
dataforge-migrate = "dataforge.migration:main"
dataforge-provision = "dataforge.v7.provisioning:main"
dataforge-kg-legacy-import = "dataforge.v7.legacy_kg_import:main"
dataforge-qa-faq-legacy-import = "dataforge.v7.legacy_qa_faq_import:main"
dataforge-drop-stale-test-collections = "dataforge.v7.stale_collection_cleanup:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"dataforge.v7" = ["resources/samples/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# src 布局：不装 editable 也能 import dataforge，避免依赖具体环境是否 pip install -e .
pythonpath = ["src"]
# 测试临时产物统一落在仓库内 .pytest-tmp/，不散落到系统临时目录或 .dataforge/。
#
# 注意：basetemp 只能通过命令行传，不是合法的 ini 选项。直接写 `basetemp = "..."`
# 会被 pytest 报 "Unknown config option: basetemp" 并静默忽略，所以放进 addopts。
#
# 指向 _active 子目录而非 .pytest-tmp 本身，原因：pytest 对显式指定的 basetemp 会
# 先 rm_rf 再重建（实测确认）。若直接指向 .pytest-tmp，每次跑测试都会清空整个目录，
# 连手工归档的产物一起删掉。用 _active 则只清空这个子目录，同级归档目录不受影响。
#
# 需要隔离某次产物时只能显式覆盖为 .pytest-tmp/<任务名>；禁止在仓库根目录
# 新建 .pytest-tmp-*，也不要把根目录 .pytest-tmp 本身传给 --basetemp。
# （命令行参数后出，会覆盖 addopts 里的值。）
addopts = "--basetemp=.pytest-tmp/_active"
