[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "dataforge"
version = "0.1.0"
description = "Document knowledge production platform"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "alembic>=1.16,<2",
  "cryptography>=45,<47",
  "minio>=7.2,<8",
  "httpx>=0.28,<1",
  "llama-index-embeddings-openai-like>=0.3,<0.4",
  "networkx>=3.6.1",
  "openpyxl>=3.1,<4",
  "openai>=1.99,<2",
  "pypdf>=5.9,<7",
  "pyarrow>=20,<22",
  "pymilvus>=2.5,<3",
  "PyMySQL>=1.1,<2",
  "python-docx>=1.2,<2",
  "pyyaml>=6,<7",
  "SQLAlchemy>=2.0,<3",
]

[project.optional-dependencies]
web = [
  "fastapi>=0.116,<1",
  "python-multipart>=0.0.20,<1",
  "uvicorn[standard]>=0.35,<1",
]
runner = [
  "jsonschema>=4.24,<5",
]

[project.scripts]
dataforge = "dataforge.cli:main"
dataforge-web = "dataforge.v7.web:main"
dataforge-worker = "dataforge.v7.worker:main"
dataforge-runner = "dataforge.v7.runner:main"
dataforge-migrate = "dataforge.migration:main"
dataforge-provision = "dataforge.v7.provisioning:main"
dataforge-kg-legacy-import = "dataforge.v7.legacy_kg_import:main"
dataforge-qa-faq-legacy-import = "dataforge.v7.legacy_qa_faq_import:main"
dataforge-drop-stale-test-collections = "dataforge.v7.stale_collection_cleanup:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"dataforge.v7" = ["resources/samples/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
